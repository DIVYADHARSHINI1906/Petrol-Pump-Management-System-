<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Billing - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-cash-register"></i> Sales & Billing</h2>
                <p class="text-muted">Manage fuel sales and billing</p>
            </div>
            <div>
                <a th:href="@{/sales/today}" class="btn btn-info me-2">
                    <i class="fas fa-calendar-day"></i> Today's Sales
                </a>
                <a th:href="@{/sales/new}" class="btn btn-primary">
                    <i class="fas fa-plus-circle"></i> New Sale
                </a>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Sales Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Fuel</th>
                                <th>Customer</th>
                                <th>Employee</th>
                                <th>Quantity (L)</th>
                                <th>Price/L (₹)</th>
                                <th>Total (₹)</th>
                                <th>Payment</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${#temporals.format(sale.saleDate, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:30</td>
                                <td th:text="${sale.fuel.name}">Petrol</td>
                                <td th:text="${sale.customer != null ? sale.customer.vehicleNumber : 'Walk-in'}">MH12AB1234</td>
                                <td th:text="${sale.employee.name}">John Doe</td>
                                <td th:text="${sale.quantity}">5.00</td>
                                <td th:text="${sale.pricePerUnit}">95.50</td>
                                <td th:text="${sale.totalAmount}">477.50</td>
                                <td>
                                    <span class="badge bg-primary" th:text="${sale.paymentMethod}">CASH</span>
                                </td>
                                <td>
                                    <a th:href="@{/sales/view/{id}(id=${sale.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <a th:href="@{/sales/delete/{id}(id=${sale.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this sale?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${sales.isEmpty()}">
                                <td colspan="9" class="text-center text-muted">No sales recorded yet. Start your first sale!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
