<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Sales - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-calendar-day"></i> Today's Sales</h2>
                <p class="text-muted">Sales recorded today</p>
            </div>
            <a th:href="@{/sales}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to All Sales
            </a>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card stat-card success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Today's Total Sales</h6>
                                <h3 th:text="'₹' + ${totalSales}">₹0</h3>
                            </div>
                            <div class="text-success">
                                <i class="fas fa-rupee-sign fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card stat-card info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Total Transactions</h6>
                                <h3 th:text="${totalTransactions}">0</h3>
                            </div>
                            <div class="text-info">
                                <i class="fas fa-receipt fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Today's Sales Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Time</th>
                                <th>Fuel</th>
                                <th>Customer</th>
                                <th>Employee</th>
                                <th>Quantity (L)</th>
                                <th>Total (₹)</th>
                                <th>Payment</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${#temporals.format(sale.saleDate, 'HH:mm')}">10:30</td>
                                <td th:text="${sale.fuel.name}">Petrol</td>
                                <td th:text="${sale.customer != null ? sale.customer.vehicleNumber : 'Walk-in'}">MH12AB1234</td>
                                <td th:text="${sale.employee.name}">John Doe</td>
                                <td th:text="${sale.quantity}">5.00</td>
                                <td th:text="${sale.totalAmount}">477.50</td>
                                <td>
                                    <span class="badge bg-primary" th:text="${sale.paymentMethod}">CASH</span>
                                </td>
                            </tr>
                            <tr th:if="${sales.isEmpty()}">
                                <td colspan="7" class="text-center text-muted">No sales recorded today yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
