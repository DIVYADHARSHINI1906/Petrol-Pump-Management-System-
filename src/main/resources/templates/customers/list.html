<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-users"></i> Customer Management</h2>
                <p class="text-muted">Manage customer information and vehicle details</p>
            </div>
            <a th:href="@{/customers/new}" class="btn btn-primary">
                <i class="fas fa-plus-circle"></i> Add New Customer
            </a>
        </div>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/customers/search}" method="get" class="d-flex gap-2">
                    <input type="text" class="form-control" name="name" placeholder="Search by customer name..." th:value="${searchTerm}">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <a th:href="@{/customers}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Clear
                    </a>
                </form>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Customers Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Vehicle Number</th>
                                <th>Customer Name</th>
                                <th>Phone Number</th>
                                <th>Address</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td th:text="${customer.vehicleNumber}">MH12AB1234</td>
                                <td th:text="${customer.customerName}">John Doe</td>
                                <td th:text="${customer.phoneNumber}">9876543210</td>
                                <td th:text="${customer.address}">123 Main St</td>
                                <td>
                                    <span th:if="${customer.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${customer.active}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td>
                                    <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/customers/delete/{id}(id=${customer.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this customer?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${customers.isEmpty()}">
                                <td colspan="6" class="text-center text-muted">No customers found. Add your first customer!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
