<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${customer.id != null ? 'Edit Customer' : 'Add New Customer'}">Customer Form</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header">
            <h2><i class="fas fa-users"></i> <span th:text="${customer.id != null ? 'Edit Customer' : 'Add New Customer'}">Add New Customer</span></h2>
            <p class="text-muted" th:text="${customer.id != null ? 'Update customer information' : 'Add a new customer to your database'}"></p>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="${customer.id != null ? '/customers/update/' + ${customer.id} : '/customers/save'}" 
                      th:object="${customer}" method="post">
                    
                    <div class="mb-3">
                        <label for="vehicleNumber" class="form-label">Vehicle Number</label>
                        <input type="text" class="form-control" id="vehicleNumber" th:field="*{vehicleNumber}" required placeholder="MH12AB1234">
                        <div class="form-text">Format: MH12AB1234 (2 letters, 2 numbers, 1-2 letters, 4 numbers)</div>
                        <div th:if="${#fields.hasErrors('vehicleNumber')}" class="text-danger small" th:errors="*{vehicleNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="customerName" class="form-label">Customer Name</label>
                        <input type="text" class="form-control" id="customerName" th:field="*{customerName}">
                        <div th:if="${#fields.hasErrors('customerName')}" class="text-danger small" th:errors="*{customerName}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" placeholder="9876543210">
                        <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger small" th:errors="*{phoneNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" th:field="*{address}" rows="3"></textarea>
                        <div th:if="${#fields.hasErrors('address')}" class="text-danger small" th:errors="*{address}"></div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                        <label class="form-check-label" for="active">Active</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> <span th:text="${customer.id != null ? 'Update' : 'Save'}">Save</span>
                        </button>
                        <a th:href="@{/customers}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back to List
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
