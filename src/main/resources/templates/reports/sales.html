<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-chart-line"></i> Sales Report</h2>
                <p class="text-muted">View sales transactions and revenue</p>
            </div>
            <a th:href="@{/reports}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Reports
            </a>
        </div>

        <!-- Date Filter Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/reports/sales}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="datetime-local" class="form-control" id="startDate" name="startDate" th:value="${startDate}">
                    </div>
                    <div class="col-md-4">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="datetime-local" class="form-control" id="endDate" name="endDate" th:value="${endDate}">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-filter"></i> Generate Report
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card stat-card success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Total Sales</h6>
                                <h3 th:text="'₹' + ${totalSales}">₹0</h3>
                            </div>
                            <div class="text-success">
                                <i class="fas fa-rupee-sign fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card stat-card info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Total Transactions</h6>
                                <h3 th:text="${totalTransactions}">0</h3>
                            </div>
                            <div class="text-info">
                                <i class="fas fa-receipt fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sales Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Fuel</th>
                                <th>Customer</th>
                                <th>Quantity (L)</th>
                                <th>Price/L (₹)</th>
                                <th>Total (₹)</th>
                                <th>Payment</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${#temporals.format(sale.saleDate, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:30</td>
                                <td th:text="${sale.fuel.name}">Petrol</td>
                                <td th:text="${sale.customer != null ? sale.customer.vehicleNumber : 'Walk-in'}">MH12AB1234</td>
                                <td th:text="${sale.quantity}">5.00</td>
                                <td th:text="${sale.pricePerUnit}">95.50</td>
                                <td th:text="${sale.totalAmount}">477.50</td>
                                <td>
                                    <span class="badge bg-primary" th:text="${sale.paymentMethod}">CASH</span>
                                </td>
                            </tr>
                            <tr th:if="${sales.isEmpty()}">
                                <td colspan="7" class="text-center text-muted">No sales found for the selected period</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
