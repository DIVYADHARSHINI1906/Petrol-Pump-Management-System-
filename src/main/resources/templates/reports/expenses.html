<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Report - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-receipt"></i> Expense Report</h2>
                <p class="text-muted">Track expenses and spending</p>
            </div>
            <a th:href="@{/reports}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Reports
            </a>
        </div>

        <!-- Date Filter Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/reports/expenses}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="datetime-local" class="form-control" id="startDate" name="startDate" th:value="${startDate}">
                    </div>
                    <div class="col-md-4">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="datetime-local" class="form-control" id="endDate" name="endDate" th:value="${endDate}">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-filter"></i> Generate Report
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Summary Card -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Total Expenses</h6>
                        <h3 class="text-danger" th:text="'₹' + ${totalExpenses}">₹0</h3>
                    </div>
                    <div class="text-danger">
                        <i class="fas fa-money-bill-wave fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Expenses Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Amount (₹)</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="expense : ${expenses}">
                                <td th:text="${#temporals.format(expense.expenseDate, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:30</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${expense.expenseType}">MAINTENANCE</span>
                                </td>
                                <td th:text="${expense.description}">Pump maintenance</td>
                                <td th:text="${expense.amount}">5000.00</td>
                                <td th:text="${expense.remarks}">Regular servicing</td>
                            </tr>
                            <tr th:if="${expenses.isEmpty()}">
                                <td colspan="5" class="text-center text-muted">No expenses found for the selected period</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
