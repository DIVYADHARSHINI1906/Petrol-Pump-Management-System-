<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-user-tie"></i> Employee Management</h2>
                <p class="text-muted">Manage employee information and access</p>
            </div>
            <a th:href="@{/employees/new}" class="btn btn-primary">
                <i class="fas fa-plus-circle"></i> Add New Employee
            </a>
        </div>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/employees/search}" method="get" class="d-flex gap-2">
                    <input type="text" class="form-control" name="name" placeholder="Search by employee name..." th:value="${searchTerm}">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <a th:href="@{/employees}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Clear
                    </a>
                </form>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Employees Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Position</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Salary</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="employee : ${employees}">
                                <td th:text="${employee.name}">John Doe</td>
                                <td th:text="${employee.position}">Pump Attendant</td>
                                <td th:text="${employee.email}">john@example.com</td>
                                <td th:text="${employee.phoneNumber}">9876543210</td>
                                <td th:text="'₹' + ${employee.salary}">₹25000</td>
                                <td>
                                    <span th:if="${employee.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${employee.active}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td>
                                    <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/employees/delete/{id}(id=${employee.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this employee?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${employees.isEmpty()}">
                                <td colspan="7" class="text-center text-muted">No employees found. Add your first employee!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
