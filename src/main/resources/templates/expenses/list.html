<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management - Petrol Pump Management System</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-receipt"></i> Expense Management</h2>
                <p class="text-muted">Track and manage petrol pump expenses</p>
            </div>
            <div>
                <a th:href="@{/expenses/today}" class="btn btn-info me-2">
                    <i class="fas fa-calendar-day"></i> Today's Expenses
                </a>
                <a th:href="@{/expenses/new}" class="btn btn-primary">
                    <i class="fas fa-plus-circle"></i> Add Expense
                </a>
            </div>
        </div>

        <!-- Summary Card -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Today's Total Expenses</h6>
                        <h3 class="text-danger" th:text="'₹' + ${totalExpenses}">₹0</h3>
                    </div>
                    <div class="text-danger">
                        <i class="fas fa-money-bill-wave fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Expenses Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Amount (₹)</th>
                                <th>Remarks</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="expense : ${expenses}">
                                <td th:text="${#temporals.format(expense.expenseDate, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:30</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${expense.expenseType}">MAINTENANCE</span>
                                </td>
                                <td th:text="${expense.description}">Pump maintenance</td>
                                <td th:text="${expense.amount}">5000.00</td>
                                <td th:text="${expense.remarks}">Regular servicing</td>
                                <td>
                                    <a th:href="@{/expenses/edit/{id}(id=${expense.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/expenses/delete/{id}(id=${expense.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this expense?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${expenses.isEmpty()}">
                                <td colspan="6" class="text-center text-muted">No expenses recorded yet. Add your first expense!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
