<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${expense.id != null ? 'Edit Expense' : 'Add New Expense'}">Expense Form</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header">
            <h2><i class="fas fa-receipt"></i> <span th:text="${expense.id != null ? 'Edit Expense' : 'Add New Expense'}">Add New Expense</span></h2>
            <p class="text-muted" th:text="${expense.id != null ? 'Update expense information' : 'Record a new expense'}"></p>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="${expense.id != null ? '/expenses/update/' + ${expense.id} : '/expenses/save'}" 
                      th:object="${expense}" method="post">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="expenseType" class="form-label">Expense Type</label>
                            <select class="form-select" id="expenseType" th:field="*{expenseType}" required>
                                <option value="">Select Type</option>
                                <option value="MAINTENANCE">Maintenance</option>
                                <option value="ELECTRICITY">Electricity</option>
                                <option value="SALARY">Salary</option>
                                <option value="RENT">Rent</option>
                                <option value="SUPPLIES">Supplies</option>
                                <option value="OTHERS">Others</option>
                            </select>
                            <div th:if="${#fields.hasErrors('expenseType')}" class="text-danger small" th:errors="*{expenseType}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="amount" class="form-label">Amount (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required>
                            <div th:if="${#fields.hasErrors('amount')}" class="text-danger small" th:errors="*{amount}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" th:field="*{description}" required>
                        <div th:if="${#fields.hasErrors('description')}" class="text-danger small" th:errors="*{description}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="expenseDate" class="form-label">Expense Date</label>
                            <input type="datetime-local" class="form-control" id="expenseDate" th:field="*{expenseDate}" required>
                            <div th:if="${#fields.hasErrors('expenseDate')}" class="text-danger small" th:errors="*{expenseDate}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="remarks" class="form-label">Remarks</label>
                            <input type="text" class="form-control" id="remarks" th:field="*{remarks}">
                            <div th:if="${#fields.hasErrors('remarks')}" class="text-danger small" th:errors="*{remarks}"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> <span th:text="${expense.id != null ? 'Update' : 'Save'}">Save</span>
                        </button>
                        <a th:href="@{/expenses}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back to List
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
