<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id != null ? 'Edit User' : 'Add New User'}">User Form</title>
</head>
<body>
    <div th:replace="layout :: content">
        <div class="page-header">
            <h2><i class="fas fa-user-cog"></i> <span th:text="${user.id != null ? 'Edit User' : 'Add New User'}">Add New User</span></h2>
            <p class="text-muted" th:text="${user.id != null ? 'Update user information' : 'Add a new user to the system'}"></p>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="${user.id != null ? '/admin/users/update/' + ${user.id} : '/admin/users/save'}" 
                      th:object="${user}" method="post">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            <div th:if="${#fields.hasErrors('username')}" class="text-danger small" th:errors="*{username}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                            <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small" th:errors="*{fullName}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" th:field="*{role}" required>
                                <option value="STAFF">Staff</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                            <div th:if="${#fields.hasErrors('role')}" class="text-danger small" th:errors="*{role}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password <span th:if="${user.id != null}">(leave blank to keep current)</span></label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" th:placeholder="${user.id != null ? 'Leave blank to keep current password' : 'Enter password'}">
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger small" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                        <label class="form-check-label" for="active">Active</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> <span th:text="${user.id != null ? 'Update' : 'Save'}">Save</span>
                        </button>
                        <a th:href="@{/admin/users}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back to List
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
