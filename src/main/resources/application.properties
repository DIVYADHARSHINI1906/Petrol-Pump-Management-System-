# Application Name
spring.application.name=petrol-pump-management

# Server Port (Render and Cloud injects PORT)
server.port=${PORT:8080}

# Database Configuration (Defaults to in-memory H2, overridden by env vars or profiles)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:petrolpumpdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Hibernate automatically detects dialect (H2, MySQL, or PostgreSQL)

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
