# Production Profile - MySQL Database Configuration
spring.application.name=petrol-pump-management

# Server Port
server.port=${PORT:8080}

# MySQL or PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petrol_pump_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Hibernate automatically detects dialect for MySQL or PostgreSQL

# Thymeleaf Configuration (production caching enabled)
spring.thymeleaf.cache=true

# Logging
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
